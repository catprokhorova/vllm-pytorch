services:
  pytorch:
    build:
      context: .
      dockerfile: Dockerfile.pt
      args:
        PYTORCH_IMAGE_TAG: ${PYTORCH_IMAGE_TAG:-2.6.0-cuda12.4-cudnn9-runtime}
    container_name: pt-qwen
    ipc: host
    shm_size: 16g
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Hugging Face Token
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

      # Модель и сервер (OpenAI-compatible API via transformers serve)
      MODEL: ${MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

      # GPU / dtype (AWQ requires auto or float16/bfloat16)
      DEVICE: ${DEVICE:-cuda:0}
      DTYPE: ${DTYPE:-auto}

      # Дополнительные флаги (true/false)
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-true}
      CONTINUOUS_BATCHING: ${CONTINUOUS_BATCHING:-false}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        ARGS=(
          "$$MODEL"
          --host "$$HOST"
          --port "$$PORT"
          --device "$$DEVICE"
          --dtype "$$DTYPE"
        )
        if [ "$$TRUST_REMOTE_CODE" = "true" ]; then
          ARGS+=(--trust-remote-code)
        fi
        if [ "$$CONTINUOUS_BATCHING" = "true" ]; then
          ARGS+=(--continuous-batching)
        fi
        exec transformers serve "$${ARGS[@]}"
