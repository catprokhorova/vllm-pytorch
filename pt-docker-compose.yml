services:
  pytorch:
    # Official PyTorch CPU image; transformers[serving] installs at startup
    image: pytorch/pytorch:2.6.0-cpu
    container_name: pt-qwen2.5-7b-cpu
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    shm_size: 16g
    volumes:
      - ./huggingface-cache:/root/.cache/huggingface
    environment:
      # Hugging Face (нужен для загрузки Qwen/Qwen2.5-7B-Instruct)
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

      # Модель и сервер (OpenAI-compatible API via transformers serve)
      MODEL: ${MODEL:-Qwen/Qwen2.5-7B-Instruct}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

      # CPU / dtype (bfloat16 ≈ 15–20 GB RAM for 7B)
      DEVICE: ${DEVICE:-cpu}
      DTYPE: ${DTYPE:-bfloat16}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-auto}

      # Дополнительные флаги (true/false)
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-true}
      CONTINUOUS_BATCHING: ${CONTINUOUS_BATCHING:-false}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        pip install -q -U "transformers[serving]" accelerate kernels
        ARGS=(
          "$$MODEL"
          --host "$$HOST"
          --port "$$PORT"
          --device "$$DEVICE"
          --dtype "$$DTYPE"
        )
        if [ "$$TRUST_REMOTE_CODE" = "true" ]; then
          ARGS+=(--trust-remote-code)
        fi
        if [ "$$CONTINUOUS_BATCHING" = "true" ]; then
          ARGS+=(--continuous-batching)
        fi
        exec transformers serve "$${ARGS[@]}"
