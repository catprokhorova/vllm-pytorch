services:
  pytorch:
    # CUDA 12.4 runtime; transformers[serving] installs at startup
    image: pytorch/pytorch:${PYTORCH_IMAGE_TAG:-2.6.0-cuda12.4-cudnn9-runtime}
    container_name: pt-qwen
    restart: unless-stopped
    gpus: all
    ipc: host
    ports:
      - "${PORT:-8000}:8000"
    shm_size: 16g
    volumes:
      - ./huggingface-cache:/root/.cache/huggingface
    environment:
      # Hugging Face (нужен для загрузки openai/gpt-oss-20b)
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

      # Модель и сервер (OpenAI-compatible API via transformers serve)
      MODEL: ${MODEL:-openai/gpt-oss-20b}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

      # GPU / dtype (MXFP4 ≈ 16 GB VRAM; bfloat16 ≈ 48 GB VRAM)
      DEVICE: ${DEVICE:-cuda:0}
      DTYPE: ${DTYPE:-auto}

      # Дополнительные флаги (true/false)
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-true}
      CONTINUOUS_BATCHING: ${CONTINUOUS_BATCHING:-false}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        pip install -q -U "transformers[serving]" accelerate kernels triton openai-harmony gptqmodel
        ARGS=(
          "$$MODEL"
          --host "$$HOST"
          --port "$$PORT"
          --device "$$DEVICE"
          --dtype "$$DTYPE"
        )
        if [ "$$TRUST_REMOTE_CODE" = "true" ]; then
          ARGS+=(--trust-remote-code)
        fi
        if [ "$$CONTINUOUS_BATCHING" = "true" ]; then
          ARGS+=(--continuous-batching)
        fi
        exec transformers serve "$${ARGS[@]}"
