services:
  pytorch:
    build:
      context: .
      dockerfile: Dockerfile.pt
    container_name: pt-qwen
    ipc: host
    shm_size: 16g
    ports:
      - "8000:8000"
    volumes:
      - ./huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Hugging Face Token
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

      # Модель и сервер (OpenAI-compatible API via transformers serve)
      MODEL: ${MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

      DEVICE: ${DEVICE:-cuda:0}
      DTYPE: ${DTYPE:-float16}

      # Дополнительные флаги (true/false)
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-true}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        ARGS=(
          serve
          --force_model "$$MODEL"
          --host "$$HOST"
          --port "$$PORT"
          --device "$$DEVICE"
          --torch_dtype "$$DTYPE"
        )
        if [ "$$TRUST_REMOTE_CODE" = "true" ]; then
          ARGS+=(--trust_remote_code)
        fi
        exec transformers "$${ARGS[@]}"
