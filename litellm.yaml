# LiteLLM gateway config. Mounted read-only into the litellm container.
#
# chat-main   -> vLLM (primary, GPU)
# chat-reserve -> Ollama on CPU (fallback, slower but alive)
#
# NOTE: "openai/..." prefix means OpenAI-compatible protocol.
# The name after "openai/" is the name the backend serves:
#   - vLLM serves "chat-main" (--served-model-name in compose.yaml)
#   - Ollama serves the model name from `ollama pull` (RESERVE_MODEL in .env)

model_list:
  - model_name: chat-main
    litellm_params:
      model: openai/chat-main
      api_base: http://vllm:8000/v1
      api_key: os.environ/VLLM_API_KEY

  - model_name: chat-reserve
    litellm_params:
      model: openai/qwen2.5:0.5b
      api_base: http://ollama:11434/v1
      api_key: none

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

router_settings:
  num_retries: 2
  timeout: 60
  fallbacks: [{"chat-main": ["chat-reserve"]}]
