services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-gptoss}
    container_name: vllm-gpt-oss-20b-gpu
    restart: unless-stopped
    gpus: all
    ipc: host
    ports:
      - "${PORT:-8000}:8000"
    shm_size: 16g
    volumes:
      - ./huggingface-cache:/root/.cache/huggingface
      - ./vllm-cache:/root/.cache/vllm
    environment:
      # Hugging Face (нужен для загрузки openai/gpt-oss-20b)
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

      # Модель и сервер
      MODEL: ${MODEL:-openai/gpt-oss-20b}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-openai/gpt-oss-20b}

      # GPU: параллелизм и память
      TENSOR_PARALLEL_SIZE: ${TENSOR_PARALLEL_SIZE:-1}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-16384}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-64}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      DTYPE: ${DTYPE:-auto}

      # Tool calling (gpt-oss)
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-openai}
      ENABLE_AUTO_TOOL_CHOICE: ${ENABLE_AUTO_TOOL_CHOICE:-true}

      # Non-Hopper GPUs (e.g. RTX 4090): set VLLM_ATTENTION_BACKEND=TRITON_ATTN_VLLM_V1
      VLLM_ATTENTION_BACKEND: ${VLLM_ATTENTION_BACKEND:-}

      # Дополнительные флаги (true/false)
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-true}
      ASYNC_SCHEDULING: ${ASYNC_SCHEDULING:-false}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        ARGS=(
          --model "$$MODEL"
          --host "$$HOST"
          --port "$$PORT"
          --served-model-name "$$SERVED_MODEL_NAME"
          --tensor-parallel-size "$$TENSOR_PARALLEL_SIZE"
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION"
          --max-num-batched-tokens "$$MAX_NUM_BATCHED_TOKENS"
          --max-num-seqs "$$MAX_NUM_SEQS"
          --max-model-len "$$MAX_MODEL_LEN"
          --dtype "$$DTYPE"
          --tool-call-parser "$$TOOL_CALL_PARSER"
        )
        if [ "$$TRUST_REMOTE_CODE" = "true" ]; then
          ARGS+=(--trust-remote-code)
        fi
        if [ "$$ENABLE_AUTO_TOOL_CHOICE" = "true" ]; then
          ARGS+=(--enable-auto-tool-choice)
        fi
        if [ "$$ASYNC_SCHEDULING" = "true" ]; then
          ARGS+=(--async-scheduling)
        fi
        exec vllm serve "$${ARGS[@]}"
